server:
  port: 8080
  tomcat:
    # Thread pool tuned for 10K/s
    threads:
      max: 400
      min-spare: 50
    max-connections: 20000
    accept-count: 1000
    connection-timeout: 2000
  # Compression for batch responses
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2048

uuid:
  datacenter-id: ${UUID_DATACENTER_ID:1}
  worker-id: ${UUID_WORKER_ID:0}

spring:
  application:
    name: uuid-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: true

# Logging
logging:
  level:
    com.uuidservice: INFO
    root: WARN

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
