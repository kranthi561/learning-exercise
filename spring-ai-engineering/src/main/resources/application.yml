spring:
  application:
    name: spring-ai-engineering
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.aiengineering: ${LOG_LEVEL:INFO}

app:
  rate-limit:
    auth-requests-per-minute: ${RATE_LIMIT_AUTH:10}
    api-requests-per-minute: ${RATE_LIMIT_API:60}
    chat-requests-per-minute: ${RATE_LIMIT_CHAT:20}
    window-seconds: ${RATE_LIMIT_WINDOW:60}
