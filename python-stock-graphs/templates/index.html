<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Stock Advisor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e8f0;
      --muted: #64748b;
      --buy: #22c55e;
      --sell: #ef4444;
      --hold: #f59e0b;
      --accent: #6366f1;
      --chart-line: #c0392b;
      --chart-peak: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #818cf8);
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 16px; flex-shrink: 0;
    }
    .brand h1 { font-size: 15px; font-weight: 600; }
    .brand p  { font-size: 11px; color: var(--muted); }

    .stock-select-wrap {
      display: flex; align-items: center; gap: 8px; margin-left: 8px;
    }
    .stock-select-wrap label { font-size: 12px; color: var(--muted); white-space: nowrap; }
    #top10-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px; font-weight: 600;
      padding: 7px 12px;
      cursor: pointer; outline: none;
      min-width: 180px;
    }
    #top10-select:focus { border-color: var(--accent); }

    /* price chip in header */
    #header-price {
      margin-left: auto;
      display: flex; align-items: center; gap: 10px;
    }
    .price-val { font-size: 18px; font-weight: 700; }
    .price-chg {
      font-size: 13px; font-weight: 600;
      padding: 3px 9px; border-radius: 6px;
    }
    .price-chg.up   { background: rgba(34,197,94,.15); color: var(--buy); }
    .price-chg.down { background: rgba(239,68,68,.15); color: var(--sell); }

    /* ── Main layout ── */
    #layout {
      flex: 1; display: flex; overflow: hidden;
    }

    /* ── Left column ── */
    #left-col {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
    }

    /* ── Chart section ── */
    #chart-section {
      flex-shrink: 0;
      padding: 14px 16px 0;
      border-bottom: 1px solid var(--border);
    }
    #chart-wrap {
      position: relative;
      height: 240px;
    }
    #range-btns {
      display: flex; gap: 2px;
      padding: 8px 0 10px;
    }
    .range-btn {
      font-size: 12px; font-weight: 500;
      padding: 4px 10px; border-radius: 6px;
      border: none; background: none;
      color: var(--muted); cursor: pointer;
      transition: background .15s, color .15s;
      position: relative;
    }
    .range-btn.active {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .range-btn .rdot {
      position: absolute; top: 3px; right: 3px;
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--chart-peak);
    }

    /* ── Chat ── */
    #chat {
      flex: 1; overflow-y: auto;
      padding: 16px 20px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .message { display: flex; gap: 10px; max-width: 780px; width: 100%; }
    .message.user  { align-self: flex-end; flex-direction: row-reverse; }
    .message.bot   { align-self: flex-start; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      display: grid; place-items: center; font-size: 14px; flex-shrink: 0;
    }
    .message.user .avatar { background: var(--accent); }
    .bubble {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 16px;
      font-size: 13px; line-height: 1.6;
    }
    .message.user .bubble { background: var(--accent); border-color: transparent; }

    /* ── Result card ── */
    .signal-badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 20px; font-weight: 700; letter-spacing: 1px;
      padding: 5px 14px; border-radius: 8px; margin-bottom: 12px;
    }
    .signal-badge.BUY  { background: rgba(34,197,94,.15);  color: var(--buy);  border: 1px solid rgba(34,197,94,.4); }
    .signal-badge.SELL { background: rgba(239,68,68,.15);  color: var(--sell); border: 1px solid rgba(239,68,68,.4); }
    .signal-badge.HOLD { background: rgba(245,158,11,.15); color: var(--hold); border: 1px solid rgba(245,158,11,.4); }

    .meta-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
    .tag {
      font-size: 11px; padding: 3px 9px; border-radius: 20px;
      background: rgba(255,255,255,.05); border: 1px solid var(--border);
    }
    .tag span { color: var(--muted); }

    .confidence-bar { margin-bottom: 12px; }
    .confidence-bar label {
      font-size: 11px; color: var(--muted);
      display: flex; justify-content: space-between; margin-bottom: 5px;
    }
    .bar-bg { height: 6px; background: rgba(255,255,255,.07); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }
    .bar-fill.BUY  { background: var(--buy); }
    .bar-fill.SELL { background: var(--sell); }
    .bar-fill.HOLD { background: var(--hold); }

    .indicators { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-bottom: 12px; }
    .ind-box {
      background: rgba(255,255,255,.03); border: 1px solid var(--border);
      border-radius: 9px; padding: 8px 10px;
    }
    .ind-box .ind-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; }
    .ind-box .ind-value { font-size: 13px; font-weight: 600; }

    .reason { font-size: 12px; color: #94a3b8; border-top: 1px solid var(--border); padding-top: 10px; }
    .reason strong { color: var(--text); }

    .news-block {
      font-size: 11px; color: var(--muted);
      margin-top: 9px; border-top: 1px solid var(--border); padding-top: 9px;
    }
    .news-block summary { cursor: pointer; color: #94a3b8; margin-bottom: 4px; }
    .news-block p { line-height: 1.7; }

    /* ── Welcome ── */
    #welcome { margin: auto; text-align: center; color: var(--muted); }
    #welcome h2 { font-size: 17px; color: var(--text); margin-bottom: 6px; }
    #welcome p  { font-size: 13px; max-width: 320px; }

    /* ── Input area ── */
    #input-area {
      padding: 12px 16px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; flex-shrink: 0;
    }
    #symbol-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 13px;
      padding: 10px 14px; outline: none;
      text-transform: uppercase; letter-spacing: 1px;
    }
    #symbol-input::placeholder { text-transform: none; letter-spacing: normal; color: var(--muted); }
    #symbol-input:focus { border-color: var(--accent); }

    .ind-select {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 12px;
      padding: 10px 10px; outline: none; cursor: pointer;
    }
    .ind-select:focus { border-color: var(--accent); }
    .ind-select-wrap { display: flex; flex-direction: column; gap: 2px; }
    .ind-select-wrap label { font-size: 10px; color: var(--muted); padding-left: 2px; }

    #send-btn {
      background: var(--accent); border: none; border-radius: 10px;
      color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 18px; cursor: pointer;
      display: flex; align-items: center; gap: 6px; transition: opacity .2s;
    }
    #send-btn:disabled { opacity: .5; cursor: not-allowed; }
    #send-btn:hover:not(:disabled) { opacity: .88; }

    /* ── Right: Live feed ── */
    #right-col {
      width: 320px; flex-shrink: 0; display: flex; flex-direction: column;
    }
    #live-header {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .live-title { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--buy); box-shadow: 0 0 5px var(--buy);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    #live-symbol-label { font-size: 11px; color: var(--accent); font-weight: 600; }
    #live-countdown { font-size: 10px; color: var(--muted); }

    #live-sentiment-bar {
      padding: 9px 14px; border-bottom: 1px solid var(--border);
      display: none; flex-shrink: 0;
    }
    #live-sentiment-bar .sent-label {
      font-size: 10px; color: var(--muted); margin-bottom: 5px;
      display: flex; justify-content: space-between;
    }
    .sent-track { height: 5px; background: rgba(255,255,255,.07); border-radius: 99px; overflow: hidden; display: flex; }
    .sent-bull { height: 100%; background: var(--buy); transition: width .5s; }
    .sent-bear { height: 100%; background: var(--sell); transition: width .5s; }

    #live-feed { flex: 1; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 7px; }
    .live-placeholder { margin: auto; text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }

    .twit {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 11px; font-size: 12px; line-height: 1.5;
      animation: fadeIn .25s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:none} }
    .twit.new { border-color: rgba(99,102,241,.5); }
    .twit-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .twit-user { font-size: 11px; font-weight: 600; color: var(--accent); }
    .twit-time { font-size: 10px; color: var(--muted); }
    .twit-body { color: #cbd5e1; word-break: break-word; }
    .twit-body a {
      color: #cbd5e1; text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      transition: color .15s, border-color .15s;
    }
    .twit-body a:hover { color: #e2e8f0; border-color: rgba(255,255,255,0.5); }
    .twit-sent {
      display: inline-block; font-size: 9px; font-weight: 600;
      padding: 2px 6px; border-radius: 99px; margin-top: 5px; letter-spacing: .3px;
    }
    .twit-sent.Bullish { background: rgba(34,197,94,.15); color: var(--buy); border: 1px solid rgba(34,197,94,.3); }
    .twit-sent.Bearish { background: rgba(239,68,68,.15); color: var(--sell); border: 1px solid rgba(239,68,68,.3); }

    /* ── Spinner ── */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite; display: inline-block;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
  </style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">📈</div>
  <div class="brand"><h1>AI Stock Advisor</h1><p>Powered by GPT-4o</p></div>

  <div class="stock-select-wrap">
    <label>Top 10</label>
    <select id="top10-select" onchange="onSelectStock(this.value)">
      <option value="AAPL">AAPL — Apple</option>
      <option value="MSFT">MSFT — Microsoft</option>
      <option value="NVDA">NVDA — Nvidia</option>
      <option value="AMZN">AMZN — Amazon</option>
      <option value="TSLA">TSLA — Tesla</option>
      <option value="GOOG">GOOG — Alphabet</option>
      <option value="META">META — Meta</option>
      <option value="NFLX">NFLX — Netflix</option>
      <option value="AMD">AMD — AMD</option>
      <option value="JPM">JPM — JPMorgan</option>
    </select>
  </div>

  <div id="header-price">
    <span class="price-val" id="hdr-price">—</span>
    <span class="price-chg" id="hdr-chg"></span>
  </div>
</header>

<!-- ── Main layout ── -->
<div id="layout">

  <!-- Left column -->
  <div id="left-col">

    <!-- Chart -->
    <div id="chart-section">
      <div id="chart-wrap"><canvas id="priceChart"></canvas></div>
      <div id="range-btns">
        <button class="range-btn" onclick="loadChart('1D')">1D</button>
        <button class="range-btn" onclick="loadChart('5D')">5D</button>
        <button class="range-btn" onclick="loadChart('1M')">1M</button>
        <button class="range-btn active" onclick="loadChart('6M')">6M</button>
        <button class="range-btn" onclick="loadChart('YTD')">YTD</button>
        <button class="range-btn" onclick="loadChart('1Y')">1Y</button>
        <button class="range-btn" onclick="loadChart('5Y')">5Y<span class="rdot"></span></button>
        <button class="range-btn" onclick="loadChart('MAX')">MAX<span class="rdot"></span></button>
      </div>
    </div>

    <!-- Chat -->
    <div id="chat">
      <div id="welcome">
        <h2>Click a stock or type a ticker to analyze</h2>
        <p>Get a BUY / SELL / HOLD signal backed by RSI, MACD, and live news.</p>
      </div>
    </div>

    <!-- Input -->
    <div id="input-area">
      <input id="symbol-input" type="text" placeholder="Enter ticker e.g. AAPL" maxlength="10"
             onkeydown="if(event.key==='Enter') sendRequest()" />

      <div class="ind-select-wrap">
        <label>Period</label>
        <select id="period-select" class="ind-select">
          <option value="1mo">1 Month</option>
          <option value="3mo" selected>3 Months</option>
          <option value="6mo">6 Months</option>
          <option value="1y">1 Year</option>
          <option value="2y">2 Years</option>
        </select>
      </div>

      <div class="ind-select-wrap">
        <label>Interval</label>
        <select id="interval-select" class="ind-select">
          <option value="1d" selected>Daily</option>
          <option value="1wk">Weekly</option>
        </select>
      </div>

      <button id="send-btn" onclick="sendRequest()">Analyze →</button>
    </div>

  </div><!-- #left-col -->

  <!-- Right column: live feed -->
  <div id="right-col">
    <div id="live-header">
      <div class="live-title"><div class="live-dot"></div>Live News Feed</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="live-symbol-label"></span>
        <span id="live-countdown"></span>
      </div>
    </div>
    <div id="live-sentiment-bar">
      <div class="sent-label">
        <span>Community Sentiment</span>
        <span id="sent-pct">—</span>
      </div>
      <div class="sent-track">
        <div class="sent-bull" id="sent-bull-bar" style="width:50%"></div>
        <div class="sent-bear" id="sent-bear-bar" style="width:50%"></div>
      </div>
    </div>
    <div id="live-feed">
      <div class="live-placeholder">Select or analyze a stock to see live news</div>
    </div>
  </div>

</div><!-- #layout -->

<script>
  /* ────────────────────────────────────────────────
     State
  ──────────────────────────────────────────────── */
  let activeSymbol  = 'AAPL';
  let activeRange   = '6M';
  let priceChart    = null;
  let liveSince     = null;
  let pollTimer     = null;
  let cntTimer      = null;
  let nextPoll      = 30;
  const POLL_SEC    = 30;
  let _bull = 0, _bear = 0;

  const chat       = document.getElementById('chat');
  const welcome    = document.getElementById('welcome');
  const input      = document.getElementById('symbol-input');
  const sendBtn    = document.getElementById('send-btn');
  const hdrPrice   = document.getElementById('hdr-price');
  const hdrChg     = document.getElementById('hdr-chg');
  const liveFeed   = document.getElementById('live-feed');
  const liveSymLbl = document.getElementById('live-symbol-label');
  const liveCtdn   = document.getElementById('live-countdown');
  const sentBar    = document.getElementById('live-sentiment-bar');
  const sentPct    = document.getElementById('sent-pct');
  const sentBull   = document.getElementById('sent-bull-bar');
  const sentBear   = document.getElementById('sent-bear-bar');

  /* ────────────────────────────────────────────────
     Init
  ──────────────────────────────────────────────── */
  window.onload = () => {
    loadChart('6M');
    startLiveFeed('AAPL');
  };

  /* ────────────────────────────────────────────────
     Top-10 selector
  ──────────────────────────────────────────────── */
  function onSelectStock(sym) {
    activeSymbol = sym;
    input.value  = sym;
    loadChart(activeRange);
    startLiveFeed(sym);
  }

  /* ────────────────────────────────────────────────
     Chart
  ──────────────────────────────────────────────── */
  function loadChart(range) {
    activeRange = range;

    // Update active button
    document.querySelectorAll('.range-btn').forEach(b => {
      b.classList.toggle('active', b.textContent.trim().startsWith(range));
    });

    fetch(`/chart/${activeSymbol}?period=${range}`)
      .then(r => r.json())
      .then(d => {
        if (d.error) return;
        renderChart(d);
        updateHeaderPrice(d.closes);
      })
      .catch(() => {});
  }

  function renderChart(d) {
    const labels  = d.labels;
    const closes  = d.closes;
    const opens   = d.opens;
    const volumes = d.volumes;

    // Colors for volume bars
    const volColors = closes.map((c, i) =>
      c >= (opens[i] ?? c) ? 'rgba(34,197,94,0.55)' : 'rgba(239,68,68,0.45)'
    );

    // Local peaks & troughs for overlay circles
    const { peaks, troughs } = findExtrema(closes, Math.max(3, Math.floor(closes.length / 20)));

    // Point radii: large circle at peaks/troughs, tiny dot at current, invisible elsewhere
    const pointRadius = closes.map((_, i) => {
      if (i === closes.length - 1) return 5;
      if (peaks.includes(i) || troughs.includes(i)) return 6;
      return 0;
    });
    const pointBg = closes.map((_, i) => {
      if (i === closes.length - 1) return '#c0392b';
      return '#f59e0b';
    });
    const pointHover = closes.map((_, i) => {
      if (i === closes.length - 1) return 8;
      if (peaks.includes(i) || troughs.includes(i)) return 8;
      return 4;
    });

    // Destroy old chart
    if (priceChart) { priceChart.destroy(); priceChart = null; }

    const ctx = document.getElementById('priceChart').getContext('2d');

    // Gradient fill
    const grad = ctx.createLinearGradient(0, 0, 0, 220);
    grad.addColorStop(0, 'rgba(192,57,43,0.35)');
    grad.addColorStop(1, 'rgba(192,57,43,0.01)');

    // Max volume scaled so bars occupy ~25% of chart height
    const maxVol = Math.max(...volumes);

    priceChart = new Chart(ctx, {
      data: {
        labels,
        datasets: [
          {
            type: 'line',
            label: 'Price',
            data: closes,
            borderColor: '#c0392b',
            borderWidth: 2,
            fill: true,
            backgroundColor: grad,
            pointRadius,
            pointBackgroundColor: pointBg,
            pointHoverRadius: pointHover,
            tension: 0.3,
            yAxisID: 'yPrice',
            order: 1,
          },
          {
            type: 'bar',
            label: 'Volume',
            data: volumes,
            backgroundColor: volColors,
            borderWidth: 0,
            yAxisID: 'yVol',
            order: 2,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                if (ctx.dataset.label === 'Price') return ` $${ctx.parsed.y.toFixed(2)}`;
                if (ctx.dataset.label === 'Volume') return ` Vol: ${ctx.parsed.y.toLocaleString()}`;
                return '';
              },
            },
          },
        },
        scales: {
          x: {
            ticks: {
              color: '#64748b', font: { size: 10 },
              maxTicksLimit: 7,
              maxRotation: 0,
            },
            grid: { color: 'rgba(255,255,255,0.05)' },
            border: { color: 'rgba(255,255,255,0.1)' },
          },
          yPrice: {
            position: 'left',
            ticks: { color: '#64748b', font: { size: 10 } },
            grid: { color: 'rgba(255,255,255,0.05)' },
            border: { color: 'rgba(255,255,255,0.1)' },
          },
          yVol: {
            position: 'right',
            max: maxVol * 4,   // push bars into bottom 25%
            ticks: { display: false },
            grid: { display: false },
            border: { display: false },
          },
        },
      },
    });
  }

  function updateHeaderPrice(closes) {
    const cur  = closes[closes.length - 1];
    const prev = closes[closes.length - 2] ?? cur;
    const diff = cur - prev;
    const pct  = ((diff / prev) * 100).toFixed(2);
    hdrPrice.textContent = `$${cur.toFixed(2)}`;
    hdrChg.textContent   = `${diff >= 0 ? '+' : ''}${diff.toFixed(2)} (${pct}%)`;
    hdrChg.className     = `price-chg ${diff >= 0 ? 'up' : 'down'}`;
  }

  function findExtrema(prices, win = 8) {
    const peaks = [], troughs = [];
    for (let i = win; i < prices.length - win; i++) {
      let peak = true, trough = true;
      for (let j = i - win; j <= i + win; j++) {
        if (j === i) continue;
        if (prices[j] >= prices[i]) peak = false;
        if (prices[j] <= prices[i]) trough = false;
      }
      if (peak)   peaks.push(i);
      if (trough) troughs.push(i);
    }
    return { peaks, troughs };
  }

  /* ────────────────────────────────────────────────
     AI Analysis
  ──────────────────────────────────────────────── */
  function sendRequest() {
    const symbol = input.value.trim().toUpperCase() || activeSymbol;
    if (!symbol) return;
    input.value = '';
    if (welcome) welcome.style.display = 'none';

    // sync selector if typed manually
    const opt = document.querySelector(`#top10-select option[value="${symbol}"]`);
    if (opt) document.getElementById('top10-select').value = symbol;

    activeSymbol = symbol;
    loadChart(activeRange);

    appendMessage('user', `Analyze <strong>${symbol}</strong>`);
    const botMsg = appendMessage('bot', '<div class="spinner"></div> Fetching data…');
    sendBtn.disabled = true;

    const period   = document.getElementById('period-select').value;
    const interval = document.getElementById('interval-select').value;

    fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symbol, period, interval }),
    })
    .then(r => r.json())
    .then(data => {
      botMsg.querySelector('.bubble').innerHTML = data.error
        ? `<span style="color:#ef4444">⚠ ${data.error}</span>`
        : buildCard(data);
      if (!data.error) startLiveFeed(symbol);
    })
    .catch(() => {
      botMsg.querySelector('.bubble').innerHTML =
        `<span style="color:#ef4444">⚠ Network error — is the server running?</span>`;
    })
    .finally(() => { sendBtn.disabled = false; chat.scrollTop = chat.scrollHeight; });
  }

  /* ────────────────────────────────────────────────
     Result card
  ──────────────────────────────────────────────── */
  function buildCard(d) {
    const dec = d.decision || 'HOLD';
    const icons = { BUY: '▲', SELL: '▼', HOLD: '■' };
    const rsiColor  = d.rsi < 30 ? '#22c55e' : d.rsi > 70 ? '#ef4444' : '#94a3b8';
    const macdColor = d.macd > d.signal ? '#22c55e' : '#ef4444';
    const newsHtml  = d.news
      ? `<details class="news-block"><summary>News Headlines</summary><p>${d.news.replace(/\n/g,'<br>')}</p></details>`
      : '';

    return `<div>
      <div class="signal-badge ${dec}">${icons[dec]} ${dec}</div>
      <div class="confidence-bar">
        <label><span>Confidence</span><span>${d.confidence}%</span></label>
        <div class="bar-bg"><div class="bar-fill ${dec}" style="width:${d.confidence}%"></div></div>
      </div>
      <div class="meta-row">
        <div class="tag"><span>Strength: </span>${d.strength}</div>
        <div class="tag"><span>Risk: </span>${d.risk}</div>
        <div class="tag"><span>Sentiment: </span>${d.news_sentiment}</div>
        <div class="tag"><span>Price: </span>$${d.price}</div>
        <div class="tag"><span>Period: </span>${d.period}</div>
        <div class="tag"><span>Interval: </span>${d.interval}</div>
      </div>
      <div class="indicators">
        <div class="ind-box"><div class="ind-label">RSI (14)</div><div class="ind-value" style="color:${rsiColor}">${d.rsi}</div></div>
        <div class="ind-box"><div class="ind-label">MACD</div><div class="ind-value" style="color:${macdColor}">${d.macd}</div></div>
        <div class="ind-box"><div class="ind-label">Signal</div><div class="ind-value">${d.signal}</div></div>
      </div>
      <div class="reason"><strong>Reasoning:</strong> ${d.reason}</div>
      ${newsHtml}
    </div>`;
  }

  /* ────────────────────────────────────────────────
     Live news feed
  ──────────────────────────────────────────────── */
  function startLiveFeed(sym) {
    if (pollTimer) clearInterval(pollTimer);
    if (cntTimer)  clearInterval(cntTimer);
    liveSince = null; _bull = 0; _bear = 0;
    liveSymLbl.textContent = sym;
    liveFeed.innerHTML = '<div class="live-placeholder"><div class="spinner"></div></div>';
    sentBar.style.display = 'none';

    fetchLive(true);
    pollTimer = setInterval(() => fetchLive(false), POLL_SEC * 1000);
    startCountdown();
  }

  function fetchLive(initial) {
    const url = `/live/${activeSymbol}` + (liveSince && !initial ? `?since=${liveSince}` : '');
    fetch(url).then(r => r.json()).then(d => {
      if (d.error) return;
      if (initial) { liveFeed.innerHTML = ''; renderMsgs(d.messages, false); }
      else renderMsgs(d.messages, true);
      if (d.since) liveSince = d.since;
      updateSentiment(d.messages, initial);
      if (initial) sentBar.style.display = 'block';
    }).catch(() => {});
  }

  function renderMsgs(msgs, isNew) {
    (msgs || []).forEach(m => {
      const el = buildTwit(m, isNew);
      isNew ? liveFeed.insertBefore(el, liveFeed.firstChild) : liveFeed.appendChild(el);
    });
  }

  function buildTwit(m, isNew) {
    const div = document.createElement('div');
    div.className = 'twit' + (isNew ? ' new' : '');
    const sentHtml = m.sentiment
      ? `<span class="twit-sent ${m.sentiment}">${m.sentiment==='Bullish'?'▲':'▼'} ${m.sentiment}</span>`
      : '';
    const bodyHtml = m.url
      ? `<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${esc(m.body)}</a>`
      : esc(m.body);
    div.innerHTML = `
      <div class="twit-head">
        <span class="twit-user">${esc(m.user)}</span>
        <span class="twit-time">${relTime(m.created_at)}</span>
      </div>
      <div class="twit-body">${bodyHtml}</div>
      ${sentHtml}`;
    if (isNew) setTimeout(() => div.classList.remove('new'), 2000);
    return div;
  }

  function updateSentiment(msgs, reset) {
    if (reset) { _bull = 0; _bear = 0; }
    (msgs || []).forEach(m => {
      if (m.sentiment === 'Bullish') _bull++;
      else if (m.sentiment === 'Bearish') _bear++;
    });
    const total = _bull + _bear;
    if (!total) return;
    const bp = Math.round((_bull / total) * 100);
    sentBull.style.width = bp + '%';
    sentBear.style.width = (100 - bp) + '%';
    sentPct.textContent  = `▲ ${bp}% Bullish · ▼ ${100 - bp}% Bearish`;
  }

  function startCountdown() {
    nextPoll = POLL_SEC;
    liveCtdn.textContent = `refresh in ${nextPoll}s`;
    cntTimer = setInterval(() => {
      nextPoll--;
      liveCtdn.textContent = nextPoll <= 0 ? 'refreshing…' : `refresh in ${nextPoll}s`;
      if (nextPoll <= 0) nextPoll = POLL_SEC;
    }, 1000);
  }

  /* ────────────────────────────────────────────────
     Helpers
  ──────────────────────────────────────────────── */
  function appendMessage(role, html) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `<div class="avatar">${role==='user'?'👤':'🤖'}</div><div class="bubble">${html}</div>`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function relTime(iso) {
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60)   return `${s}s ago`;
    if (s < 3600) return `${Math.floor(s/60)}m ago`;
    return `${Math.floor(s/3600)}h ago`;
  }
</script>
</body>
</html>
